# yolov8_pico_pure_linear.yaml
nc: 4  # 4 classes for FSOCO
scales:
  # [depth_multiple, width_multiple, max_channels]
  pico: [1.0, 0.15, 1024] 

# Pure Sequential Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]   # 0: Downsample (256x256)
  - [-1, 1, Conv, [128, 3, 2]]  # 1: Downsample (128x128)
  - [-1, 1, Conv, [128, 3, 1]]  # 2: Feature Extraction
  - [-1, 1, Conv, [128, 3, 1]]  # 3: Feature Extraction
  - [-1, 1, Conv, [256, 3, 2]]  # 4: Downsample (64x64)
  - [-1, 1, Conv, [256, 3, 1]]  # 5: Feature Extraction
  - [-1, 1, Conv, [256, 3, 1]]  # 6: Feature Extraction
  - [-1, 1, Conv, [512, 3, 2]]  # 7: Downsample (32x32)
  - [-1, 1, Conv, [512, 3, 1]]  # 8: Feature Extraction
  - [-1, 1, Conv, [512, 3, 1]]  # 9: Feature Extraction
  - [-1, 1, Conv, [1024, 3, 2]] # 10: Downsample (16x16)
  - [-1, 1, Conv, [1024, 3, 1]] # 11: Feature Extraction
  - [-1, 1, Conv, [1024, 5, 1]] # 12: SPPF Replacement (5x5 Kernel)

# Pure Sequential Head
head:
  - [-1, 1, Conv, [256, 3, 1]]  # 13: Final Feature Processing
  - [[-1], 1, Detect, [nc]]     # 14: Detection Output